name: Build CV
on:
  push:
    paths:
      - "cv/cv.tex"
      - ".github/workflows/build-cv.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
          working_directory: cv
      - run: |
          mv cv/cv.pdf CV.pdf
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A cv CV.pdf
          git commit -m "Update CV PDF" || exit 0
          git push
